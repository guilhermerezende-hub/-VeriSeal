<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VeriSeal — Autêntico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@500;600&display=swap">
  <!--
    Tela de resultado da verificação VeriSeal: Autêntico.
    Arquivo independente (HTML + CSS + JS, sem dependências). A única animação é a do selo, que não se move:
    o traço contorna o círculo, a cor surge de dentro para fora e o ✓ se desenha no centro.
  -->
  <style>
    :root {
      --ink: #0f1a2e;
      --ink-2: #5a6377;
      --navy: #042555;
      --ok-ink: #0f8a3c;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --ease-io: cubic-bezier(.65, 0, .35, 1);
      --grow: cubic-bezier(.3, .7, .4, 1)
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 16px;
      background: #eef1f5;
      color: var(--ink);
      font: 400 16px/1.5 var(--font);
      -webkit-font-smoothing: antialiased
    }

    h1,
    p,
    dl,
    dd {
      margin: 0
    }

    svg,
    img {
      display: block
    }

    .sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden
    }

    /* a tela, sem moldura de celular; tudo dentro dela em cqi, para escalar com a largura */
    .screen {
      position: relative;
      width: min(390px, 100%);
      aspect-ratio: 390 / 760;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(#f5f8fc, #fff 45%);
      box-shadow: 0 30px 60px -32px rgba(8, 20, 50, .32), 0 0 0 1px rgba(15, 26, 46, .06);
      container-type: inline-size
    }

    .wb-logo {
      height: 4cqi;
      width: auto;
      aspect-ratio: 833.41 / 100;
      margin: 9cqi auto 0;
      --lg-ink: var(--navy)
    }

    .wb-res {
      position: absolute;
      left: 6cqi;
      right: 6cqi;
      top: 24cqi;
      bottom: 7cqi;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center
    }

    /* selo do resultado: não se move. O círculo claro já está ali; o traço dá uma volta nele,
       a cor surge de dentro para fora e o ✓ se desenha no centro */
    .wb-badge {
      --tone: 20, 166, 74;
      position: relative;
      flex: none;
      width: 34cqi;
      height: 34cqi
    }

    /* sombra suave embaixo */
    .wb-badge::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      box-shadow: 0 3cqi 7cqi rgba(var(--tone), .3)
    }

    /* os círculos são SVG: uma caixa HTML de 34cqi arredonda para o pixel e o círculo sairia achatado */
    .wb-badge svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .wb-glow {
      fill: none;
      stroke: rgba(var(--tone), .13);
      stroke-width: 5.88
    }

    .wb-track {
      fill: rgba(var(--tone), .1)
    }

    .wb-fill {
      transform-box: fill-box;
      transform-origin: center
    }

    .wb-badge path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1 2
    }

    .wb-ring {
      stroke: rgb(var(--tone));
      stroke-width: 2.4
    }

    .wb-mark {
      stroke: #fff;
      stroke-width: 5
    }

    .is-on .wb-ring {
      animation: strokeIn .7s var(--ease-io) .3s both
    }

    .is-on .wb-fill {
      animation: fillIn .4s var(--grow) .85s both
    }

    .is-on .wb-glow,
    .is-on .wb-badge::before {
      animation: glowIn .4s ease .95s both
    }

    .is-on .wb-mark {
      animation: strokeIn .35s var(--ease-io) 1.15s both
    }

    /* 1.05 (e não 1): com ponta redonda, um traço de comprimento zero no início apareceria como um ponto */
    @keyframes strokeIn {
      from {
        stroke-dashoffset: 1.05
      }
    }

    @keyframes fillIn {
      from {
        transform: scale(0)
      }
    }

    @keyframes glowIn {
      from {
        opacity: 0
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .is-on .wb-ring,
      .is-on .wb-fill,
      .is-on .wb-glow,
      .is-on .wb-mark,
      .is-on .wb-badge::before {
        animation: none
      }
    }

    .wb-title {
      margin-top: 7cqi;
      font-size: 9cqi;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.05;
      color: var(--ok-ink)
    }

    .wb-sub {
      margin-top: 1.8cqi;
      font-size: 4.5cqi;
      color: var(--ink-2)
    }

    .wb-prod,
    .wb-card {
      width: 100%;
      border-radius: 4.5cqi;
      background: #fff;
      box-shadow: 0 .5cqi 2cqi rgba(15, 26, 46, .08), 0 0 0 .3cqi rgba(15, 26, 46, .05);
      text-align: left
    }

    .wb-prod {
      display: flex;
      align-items: center;
      gap: 3.6cqi;
      margin-top: 7cqi;
      padding: 2.6cqi
    }

    .wb-thumb {
      flex: none;
      width: 15cqi;
      height: 19cqi;
      border-radius: 3.4cqi;
      object-fit: cover;
      background: #f1f5fb
    }

    .wb-prod b {
      display: block;
      font-size: 4.6cqi;
      font-weight: 700;
      letter-spacing: -.01em
    }

    .wb-prod span {
      display: block;
      margin-top: .6cqi;
      font-size: 3.7cqi;
      color: var(--ink-2)
    }

    .wb-card {
      margin-top: 2.6cqi;
      padding: 1cqi 4cqi
    }

    .wb-card div {
      display: flex;
      justify-content: space-between;
      gap: 3cqi;
      padding: 2.4cqi 0;
      border-bottom: .3cqi solid rgba(15, 26, 46, .07);
      font-size: 4cqi
    }

    .wb-card div:last-child {
      border-bottom: 0
    }

    .wb-card dt {
      color: var(--ink-2)
    }

    .wb-card dd {
      font-weight: 600;
      text-align: right
    }

    .mono {
      font-family: var(--mono)
    }

    .wb-btn {
      width: 100%;
      margin-top: auto;
      padding: 3.4cqi;
      border: 0;
      border-radius: 3.6cqi;
      background: var(--navy);
      color: #fff;
      font: 600 4.2cqi/1.5 var(--font);
      cursor: pointer
    }

    .replay {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(15, 26, 46, .12);
      border-radius: 12px;
      background: #fff;
      color: var(--navy);
      font: 600 15px/1 var(--font);
      cursor: pointer
    }

    .replay svg {
      width: 18px;
      height: 18px
    }

    .replay:focus-visible,
    .wb-btn:focus-visible {
      outline: 2px solid #03adf9;
      outline-offset: 3px
    }
  </style>
</head>
