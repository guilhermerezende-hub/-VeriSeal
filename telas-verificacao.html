<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VeriSeal — Telas de verificação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@500;600&display=swap">
  <!--
    Telas de resultado da verificação VeriSeal: Autêntico e Adulterado.
    Arquivo independente (HTML + CSS + JS, sem dependências). A única animação é o giro do selo:
    ele gira como uma moeda e, quando para de frente, o símbolo se desenha.
    Abra com #autentico ou #adulterado no fim do endereço para ver só uma das telas.
  -->
  <style>
    :root {
      --ink: #0f1a2e;
      --ink-2: #5a6377;
      --navy: #042555;
      --ok-ink: #0f8a3c;
      --bad-ink: #c62a1f;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      --ease-io: cubic-bezier(.65, 0, .35, 1);
      --spin: cubic-bezier(.2, .75, .25, 1)
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 16px;
      background: #eef1f5;
      color: var(--ink);
      font: 400 16px/1.5 var(--font);
      -webkit-font-smoothing: antialiased
    }

    h2,
    p,
    dl,
    dd {
      margin: 0
    }

    svg,
    img {
      display: block
    }

    [hidden] {
      display: none !important
    }

    .sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden
    }

    .screens {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 32px;
      width: 100%
    }

    /* a tela, sem moldura de celular; tudo dentro dela em cqi, para escalar com a largura */
    .screen {
      position: relative;
      width: min(390px, 100%);
      aspect-ratio: 390 / 760;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(#f5f8fc, #fff 45%);
      box-shadow: 0 30px 60px -32px rgba(8, 20, 50, .32), 0 0 0 1px rgba(15, 26, 46, .06);
      container-type: inline-size
    }

    .wb-logo {
      height: 5.4cqi;
      width: auto;
      aspect-ratio: 977 / 161;
      margin: 9cqi auto 0;
      --lg-ink: var(--navy)
    }

    .wb-res {
      position: absolute;
      left: 6cqi;
      right: 6cqi;
      top: 24cqi;
      bottom: 7cqi;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center
    }

    /* selo do resultado */
    .wb-badge {
      flex: none;
      display: grid;
      place-items: center;
      width: 34cqi;
      height: 34cqi;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #45e083, #14a64a 72%);
      box-shadow: 0 0 0 2cqi rgba(20, 166, 74, .13), 0 3cqi 7cqi rgba(20, 166, 74, .3)
    }

    .bad .wb-badge {
      background: radial-gradient(circle at 50% 30%, #ff7166, #d93025 72%);
      box-shadow: 0 0 0 2cqi rgba(217, 48, 37, .13), 0 3cqi 7cqi rgba(217, 48, 37, .3)
    }

    .wb-badge svg {
      width: 56%;
      height: 56%
    }

    .wb-badge path {
      fill: none;
      stroke: #fff;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1
    }

    /* o giro: duas voltas como uma moeda, desacelerando até parar de frente; depois o símbolo se desenha */
    .is-on .wb-badge {
      animation: badgeSpin 1.1s var(--spin) .3s both
    }

    .is-on .wb-badge path {
      animation: badgeDraw .35s var(--ease-io) 1.25s forwards
    }

    @keyframes badgeSpin {
      from {
        transform: perspective(500px) rotateY(-720deg) scale(.5);
        opacity: 0
      }

      25% {
        opacity: 1
      }

      to {
        transform: perspective(500px) rotateY(0) scale(1);
        opacity: 1
      }
    }

    @keyframes badgeDraw {
      to {
        stroke-dashoffset: 0
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .is-on .wb-badge {
        animation: none
      }

      .is-on .wb-badge path {
        animation: none;
        stroke-dashoffset: 0
      }
    }

    .wb-title {
      margin-top: 7cqi;
      font-size: 9cqi;
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.05;
      color: var(--ok-ink)
    }

    .bad .wb-title {
      color: var(--bad-ink)
    }

    .wb-sub {
      margin-top: 1.8cqi;
      font-size: 4.5cqi;
      color: var(--ink-2)
    }

    .wb-prod,
    .wb-card {
      width: 100%;
      border-radius: 4.5cqi;
      background: #fff;
      box-shadow: 0 .5cqi 2cqi rgba(15, 26, 46, .08), 0 0 0 .3cqi rgba(15, 26, 46, .05);
      text-align: left
    }

    .wb-prod {
      display: flex;
      align-items: center;
      gap: 3.6cqi;
      margin-top: 7cqi;
      padding: 2.6cqi
    }

    .wb-thumb {
      flex: none;
      width: 15cqi;
      height: 19cqi;
      border-radius: 3.4cqi;
      object-fit: cover;
      background: #f1f5fb
    }

    .wb-prod b {
      display: block;
      font-size: 4.6cqi;
      font-weight: 700;
      letter-spacing: -.01em
    }

    .wb-prod span {
      display: block;
      margin-top: .6cqi;
      font-size: 3.7cqi;
      color: var(--ink-2)
    }

    .wb-card {
      margin-top: 2.6cqi;
      padding: 1cqi 4cqi
    }

    .wb-card div {
      display: flex;
      justify-content: space-between;
      gap: 3cqi;
      padding: 2.4cqi 0;
      border-bottom: .3cqi solid rgba(15, 26, 46, .07);
      font-size: 4cqi
    }

    .wb-card div:last-child {
      border-bottom: 0
    }

    .wb-card dt {
      color: var(--ink-2)
    }

    .wb-card dd {
      font-weight: 600;
      text-align: right
    }

    .mono {
      font-family: var(--mono)
    }

    .wb-alert {
      color: var(--bad-ink)
    }

    .wb-note {
      margin-top: 3cqi;
      font-size: 3.8cqi;
      line-height: 1.35;
      color: var(--ink-2)
    }

    .wb-btn {
      width: 100%;
      margin-top: auto;
      padding: 3.4cqi;
      border: 0;
      border-radius: 3.6cqi;
      background: var(--navy);
      color: #fff;
      font: 600 4.2cqi/1.5 var(--font);
      cursor: pointer
    }

    .bad .wb-btn {
      background: var(--bad-ink)
    }

    .replay {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(15, 26, 46, .12);
      border-radius: 12px;
      background: #fff;
      color: var(--navy);
      font: 600 15px/1 var(--font);
      cursor: pointer
    }

    .replay svg {
      width: 18px;
      height: 18px
    }

    .replay:focus-visible,
    .wb-btn:focus-visible {
      outline: 2px solid #03adf9;
      outline-offset: 3px
    }
  </style>
</head>
